suite: test ingress
templates:
  - ingress.yaml
tests:
  - it: should not create ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stump

  - it: should add annotations when specified
    set:
      ingress.enabled: true
      ingress.annotations:
        my-annotation: my-value
    asserts:
      - equal:
          path: metadata.annotations.my-annotation
          value: my-value

  - it: should set className correctly
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should keep tls empty when not specified
    set:
      ingress:
        enabled: true
    asserts:
      - notExists:
          path: spec.tls

  - it: should add certificate when specified
    set:
      ingress:
        enabled: true
        tls:
        - secretName: stump-tls
          hosts:
            - stump.example.com
    asserts:
      - equal:
          path: spec.tls[0].hosts[0]
          value: stump.example.com
      - equal:
          path: spec.tls[0].secretName
          value: stump-tls

  - it: should use custom service port
    set:
      ingress.enabled: true
      service.port: 10801
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 10801
