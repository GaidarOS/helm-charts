# =============================================================================
# Stump Helm values
# =============================================================================

replicaCount: 1

image:
  # Use the Stump image you want to deploy.
  repository: aaronleopold/stump

  # Recommended: pin this to a Stump release rather than using latest.
  tag: ""

  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Stump configuration
#
# These values are rendered into Stump.toml.
#
# Environment variables supplied through env/envFrom have higher precedence
# than values in Stump.toml.
# =============================================================================

config:
  ip: "0.0.0.0"
  port: 10801

  verbosity: 1
  prettyLogs: true

  # Optional custom SQLite database path.
  dbPath: ""

  dbTimeoutSecs: 30

  clientDir: "/app/client"
  configDir: "/config"

  allowedOrigins: []

  # The official Stump image provides PDFium at this location.
  pdfiumPath: "/usr/local/lib/libpdfium.so"

  enablePlayground: false
  enableKoreaderSync: false
  enableKoboSync: false
  enableOpdsProgression: false

  passwordHashCost: 12

  sessionTtl: 259200
  accessTokenTtl: 86400
  refreshTokenTtl: 2592000
  expiredSessionCleanupInterval: 86400

  parallelismMultiplier: 2

  maxImageUploadSize: 20971520
  enableUpload: false
  maxFileUploadSize: 20971520

  pdfRenderDpi: 150
  pdfMaxDimension: 1200
  pdfRenderFormat: webp
  pdfCachePages: true
  pdfPrerenderRange: 5
  pdfHighQuality: true

  trustProxyHeaders: false

# =============================================================================
# OIDC
#
# OIDC credentials should normally be supplied through a Secret rather than
# putting them in this values file.
#
# The corresponding environment variables are:
#
# STUMP_OIDC_ENABLED
# STUMP_OIDC_CLIENT_ID
# STUMP_OIDC_ISSUER_URL
# STUMP_OIDC_CLIENT_SECRET
# STUMP_OIDC_SCOPES
# STUMP_OIDC_ALLOW_REGISTRATION
# STUMP_OIDC_DISABLE_LOCAL_AUTH
# STUMP_OIDC_EXTRA_AUDIENCES
# STUMP_OIDC_CA_CERT_FILE
#
# =============================================================================

oidc:
  enabled: false

  # Non-secret OIDC configuration can optionally be supplied here.
  #
  # If these are set, the StatefulSet receives them as environment variables.
  #
  clientId: ""
  issuerUrl: ""
  scopes:
    - openid
    - email
    - profile

  allowRegistration: true
  disableLocalAuth: false

  extraAudiences: []

  # Optional path inside the container to a CA certificate.
  caCertFile: ""

  # Secret containing sensitive OIDC credentials.
  #
  # Expected keys:
  #   clientSecret
  #
  # The chart maps:
  #   clientSecret -> STUMP_OIDC_CLIENT_SECRET
  #
  existingSecret: ""

  existingSecretKeys:
    clientSecret: clientSecret

# =============================================================================
# Arbitrary environment variables
# =============================================================================

# Plain environment variables.
#
# Example:
#
# extraEnv:
#   - name: STUMP_ENABLE_UPLOAD
#     value: "true"
#
extraEnv: []

# Import every key in an existing Secret as an environment variable.
#
# This is particularly useful if you want a Secret containing:
#
#   STUMP_OIDC_CLIENT_ID
#   STUMP_OIDC_ISSUER_URL
#   STUMP_OIDC_CLIENT_SECRET
#   STUMP_SOME_OTHER_SETTING
#
# and don't want the chart to know about each individual key.
extraEnvFromSecrets: []

# Import every key in an existing ConfigMap as an environment variable.
extraEnvFromConfigMaps: []

# Individual environment variables sourced from Kubernetes Secrets or
# ConfigMaps.
#
# Example:
#
# secretEnv:
#   - name: STUMP_OIDC_CLIENT_SECRET
#     secretKeyRef:
#       name: stump-oidc
#       key: clientSecret
#
secretEnv: []

configMapEnv: []

# =============================================================================
# Service
# =============================================================================

service:
  type: ClusterIP
  port: 10801
  targetPort: http

  annotations: {}

  # Optional:
  # clusterIP: ""

  # Optional:
  # loadBalancerIP: ""

  # Optional:
  # externalTrafficPolicy: Cluster

# =============================================================================
# Ingress
# =============================================================================

ingress:
  enabled: false

  className: ""

  annotations: {}

  hosts:
    - host: stump.example.com
      paths:
        - path: /
          pathType: Prefix

  tls: []
  # Example:
  #
  # tls:
  #   - secretName: stump-tls
  #     hosts:
  #       - stump.example.com

# =============================================================================
# Gateway API HTTPRoute
# =============================================================================

httpRoute:
  enabled: false

  parentRefs:
    - name: gateway
      # namespace: ""
      # sectionName: https

  hostnames:
    - stump.example.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# =============================================================================
# Persistence
# =============================================================================

persistence:
  config:
    enabled: true

    accessModes:
      - ReadWriteOnce

    size: 10Gi

    storageClass: ""

    annotations: {}

    # Set an existing PVC instead of creating one.
    existingClaim: ""

  data:
    enabled: true

    accessModes:
      - ReadWriteOnce

    size: 1Ti

    storageClass: ""

    annotations: {}

    existingClaim: ""

# =============================================================================
# Probes
# =============================================================================

probes:
  liveness:
    enabled: true
    path: /api/v2/ping
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readiness:
    enabled: true
    path: /api/v2/ping
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  startup:
    enabled: true
    path: /api/v2/ping
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1

# =============================================================================
# Resources
# =============================================================================

resources: {}

# Example:
#
# resources:
#   requests:
#     cpu: 250m
#     memory: 512Mi
#   limits:
#     cpu: "2"
#     memory: 2Gi

# =============================================================================
# Security
# =============================================================================

podSecurityContext:
  fsGroup: 1000
  # fsGroupChangePolicy: OnRootMismatch

securityContext:
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #     - ALL
  readOnlyRootFilesystem: false

# =============================================================================
# Service account
# =============================================================================

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# =============================================================================
# Pod metadata
# =============================================================================

podAnnotations: {}
podLabels: {}

# =============================================================================
# Scheduling
# =============================================================================

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

priorityClassName: ""

# =============================================================================
# StatefulSet
# =============================================================================

podManagementPolicy: OrderedReady

updateStrategy:
  type: RollingUpdate

revisionHistoryLimit: 10

terminationGracePeriodSeconds: 30

# =============================================================================
# Networking
# =============================================================================

dnsPolicy: ClusterFirst

dnsConfig: {}

hostNetwork: false

# =============================================================================
# Extra volumes
# =============================================================================

extraVolumes: []

extraVolumeMounts: []

# =============================================================================
# Init containers
# =============================================================================

initContainers: []

# =============================================================================
# Pod-level environment
# =============================================================================

hostAliases: []
